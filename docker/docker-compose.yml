version: '3.5'

services:
  ### Jesse's Workspace ################################################
  jesse:
    image: salehmir/jesse:latest
    depends_on:
      - postgres
      - redis
    tty: true
    env_file:
      - ../.env
    ports:
      # Dashboard, API, and MCP (http://localhost:9000/mcp)
      - "9000:9000"
      # Direct MCP port, used only by older Jesse versions that served MCP on port 9002.
      # Current versions keep this port inside the container and serve MCP on 9000 at /mcp,
      # so this mapping has no effect with them and can be removed.
      - "9002:9002"
      # Jupyter Port
      - "8888:8888"
      # LSP Port
      - "9001:9001"
    volumes:
      - ../:/home
    container_name: jesse
    command: bash -c "jesse install-live --no-strict && jesse run"

  ### PostgreSQL ################################################
  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=jesse_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=jesse_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    container_name: postgres

  ### Redis ################################################
  redis:
    image: redis:6-alpine
    container_name: redis
    command: redis-server --save "" --appendonly no
    
volumes:
  postgres-data:
